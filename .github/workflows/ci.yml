name: Gateway quality gates
on:
  push:
  pull_request:
    branches: [develop, main]
permissions:
  contents: read
jobs:
  gateway:
    name: Gateway checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: integration-only
          POSTGRES_DB: gateway_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d gateway_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://postgres:integration-only@localhost:5432/gateway_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm run test:cov
      - run: npm audit --audit-level=high
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: gateway-coverage
          path: coverage/
          if-no-files-found: warn

  publish-image:
    name: Publish reviewed API Gateway image
    needs: [gateway]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      packages: write
    concurrency:
      group: gateway-image-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Require peer approval on the merged PR's final code
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const { owner, repo } = context.repo;
            const prs = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
              owner, repo, commit_sha: context.sha, per_page: 100
            });
            for (const pr of prs.filter(pr => pr.merged_at && pr.base.ref === 'develop' && pr.merge_commit_sha === context.sha)) {
              const reviews = await github.paginate(github.rest.pulls.listReviews, { owner, repo, pull_number: pr.number, per_page: 100 });
              const latest = new Map();
              for (const review of reviews) {
                if (review.user && ['APPROVED', 'CHANGES_REQUESTED', 'DISMISSED'].includes(review.state)) latest.set(review.user.login, review);
              }
              const decisions = [...latest.values()];
              const approved = decisions.some(r => r.state === 'APPROVED' && r.commit_id === pr.head.sha && r.user.login !== pr.user.login);
              if (approved && !decisions.some(r => r.state === 'CHANGES_REQUESTED')) return;
            }
            throw new Error('Image publication requires a merged PR into develop with peer approval on its final head commit.');
      - name: Prepare temporary registry login and builder
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$RUNNER_TEMP/gateway-registry"
          install -d -m 700 "$DOCKER_CONFIG"
          echo "DOCKER_CONFIG=$DOCKER_CONFIG" >> "$GITHUB_ENV"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker buildx create --name gateway-release --driver docker-container --use
          docker buildx inspect --bootstrap
      - name: Build and publish commit-tagged image
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx build --platform linux/amd64 --push \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$image:$GITHUB_SHA" \
            --metadata-file "$RUNNER_TEMP/gateway-image.json" .
          digest=$(jq -er '."containerimage.digest"' "$RUNNER_TEMP/gateway-image.json")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          jq -n --arg commit "$GITHUB_SHA" --arg image "$image@$digest" \
            '{commit: $commit, image: $image}' > release-image.json
          {
            echo '### Published API Gateway image'
            echo '```json'
            cat release-image.json
            echo '```'
            echo 'Staging deployment follows when enabled and release checks pass.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gateway-release-image
          path: release-image.json
          if-no-files-found: error
          overwrite: true
      - name: Remove registry login
        if: always()
        run: |
          export DOCKER_CONFIG="$RUNNER_TEMP/gateway-registry"
          docker logout ghcr.io || true

  deploy-staging:
    name: Deploy api-gateway to staging
    needs: publish-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && vars.SERVICE_STAGING_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    permissions:
      contents: read
      actions: read
      pull-requests: read
    concurrency:
      group: gateway-staging-release
      cancel-in-progress: false
    steps:
      - name: Deploy this run's reviewed immutable images
        uses: forever-hotel/infra/.github/actions/deploy-service@e1f320d8c3b7622339291f70c1acd3b7458df439
        with:
          service: gateway
          artifact: gateway-release-image
          host: ${{ vars.STAGING_HOST }}
          user: ${{ vars.STAGING_USER }}
          ssh-key: ${{ secrets.STAGING_SSH_KEY }}
          known-hosts: ${{ secrets.STAGING_KNOWN_HOSTS }}
      - name: Retain service deployment receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gateway-staging-receipt
          path: ${{ runner.temp }}/service-release/receipt.json
          if-no-files-found: warn
          overwrite: true
